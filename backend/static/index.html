<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Movies Online</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gradient-to-r from-indigo-900 via-purple-900 to-pink-900 min-h-screen text-white">
    <div class="container mx-auto p-6">
      <header class="mb-6">
        <h1 class="text-4xl font-extrabold">Movies Online</h1>
        <p class="text-indigo-200">Browse, search and review modern movies.</p>
      </header>

      <div class="bg-white/5 rounded-lg p-4 mb-6">
        <div class="flex gap-3 items-center">
          <input id="search" placeholder="Search title, e.g., Edge of Tomorrow" class="flex-1 p-3 rounded bg-white/10 placeholder:text-indigo-200" />
          <select id="category" class="p-3 rounded bg-white/10">
            <option value="">All categories</option>
          </select>
          <input id="year" type="number" placeholder="Year" class="w-24 p-3 rounded bg-white/10" />
          <button id="btnSearch" class="bg-indigo-600 px-4 py-2 rounded">Search</button>
        </div>
      </div>

      <main>
        <div id="movies" class="grid grid-cols-1 md:grid-cols-3 gap-6"></div>
      </main>
    </div>
    <script src="/static/app.js"></script>
  </body>
</html>
